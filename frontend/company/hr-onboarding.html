<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Puvima IT Service and Research Consultancy — HR Onboarding &amp; Verification Center</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/png" href="/assets/images/logo/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/company/css/styles.css">
  <link rel="stylesheet" href="/company/css/components.css">
  <link rel="stylesheet" href="/company/css/responsive.css">
</head>
<body>

  <div class="portal-wrapper">
    
    <!-- Sidebar -->
    <aside class="portal-sidebar">
      <div class="sidebar-header">
        <img src="/company/assets/logo/puvima-emblem.png" alt="PUVIMA" class="brand-monogram" style="object-fit: contain; background: transparent; box-shadow: none;">
        <div class="brand-info">
          <span class="brand-title">PUVIMA</span>
          <span class="brand-subtitle">HR Verification</span>
        </div>
      </div>

      <nav class="sidebar-nav">
        <div class="nav-section-title">Operations</div>
        
        <a href="/company/hr" class="nav-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>
          <span>Projects Pipeline</span>
        </a>

        <a href="/company/hr?tab=people" class="nav-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
          <span>Workforce Directory</span>
        </a>

        <a href="/company/hr?tab=interns" class="nav-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M22 10v6M2 10l10-5 10 5-10 5z"></path><path d="M6 12v5c3 3 9 3 12 0v-5"></path></svg>
          <span>Internship Track</span>
        </a>

        <a href="/company/hr/onboarding" class="nav-item active">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><polyline points="16 11 18 13 22 9"></polyline></svg>
          <span>Onboarding Verification</span>
        </a>
      </nav>

      <div class="sidebar-footer">
        <div class="user-mini-card">
          <div class="user-avatar current-user-avatar">H</div>
          <div class="user-meta">
            <div class="user-meta-name current-user-name">HR Lead</div>
            <div class="user-meta-role current-user-role">Human Resources</div>
          </div>
          <button data-logout-btn class="btn-sm btn-outline" style="border: none; padding: 4px;" title="Sign Out">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
          </button>
        </div>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="portal-main">
      
      <!-- Topbar -->
      <header class="portal-topbar">
        <div class="topbar-search">
          <span style="font-weight: 700; color: #001D35; font-size: 1.05rem;">
            PUVIMA HR Verification Center
          </span>
        </div>

        <div class="topbar-actions">
          <a href="/onboarding" target="_blank" class="btn btn-outline-primary btn-sm" style="font-size: 12px; padding: 6px 12px;">
            Open Applicant Portal &rarr;
          </a>
          <button class="icon-button" id="notifBellBtn" title="Notifications">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" width="18" height="18"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
          </button>
        </div>
      </header>

      <div class="portal-content">
        <!-- Main Onboarding Container -->
        <div id="hrTabContent">
          <!-- Populated by hrOnboardingController.js -->
        </div>
      </div>
    </main>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/company/js/config.js"></script>
  <script src="/company/js/supabaseClient.js"></script>
  <script src="/company/js/auth.js"></script>
  <script src="/company/js/ui.js"></script>
  <script src="/company/js/services/userService.js"></script>
  <script src="/company/js/services/notificationService.js"></script>
  <script src="/company/js/controllers/hrOnboardingController.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      // Check auth for HR/Admin
      const currentUser = window.Auth.requireAuth(['HR', 'Admin', 'SuperAdmin']);
      if (!currentUser) return;

      // Populate user info in header
      const nameEl = document.querySelector('.current-user-name');
      const roleEl = document.querySelector('.current-user-role');
      const avEl = document.querySelector('.current-user-avatar');
      if (nameEl) nameEl.textContent = currentUser.name || 'HR Lead';
      if (roleEl) roleEl.textContent = currentUser.role || 'Human Resources';
      if (avEl) avEl.textContent = (currentUser.name || 'H').charAt(0).toUpperCase();

      const logoutBtn = document.querySelector('[data-logout-btn]');
      if (logoutBtn) {
        logoutBtn.addEventListener('click', () => window.Auth.logout());
      }

      // Initialize Onboarding Module
      const container = document.getElementById('hrTabContent');
      if (window.initHrOnboardingModule) {
        window.initHrOnboardingModule(container);
      }
    });
  </script>
</body>
</html>
