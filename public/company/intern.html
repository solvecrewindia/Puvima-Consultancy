<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PUVIMA Consultancy — Research Intern Workspace</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/png" href="/assets/images/logo/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/company/css/styles.css">
  <link rel="stylesheet" href="/company/css/components.css">
  <link rel="stylesheet" href="/company/css/timeline.css">
  <link rel="stylesheet" href="/company/css/responsive.css">
</head>
<body>

  <div class="portal-wrapper">
    
    <!-- Sidebar -->
    <aside class="portal-sidebar">
      <div class="sidebar-header">
        <div class="brand-monogram">PV</div>
        <div class="brand-info">
          <span class="brand-title">PUVIMA</span>
          <span class="brand-subtitle">Internship Track</span>
        </div>
      </div>

      <nav class="sidebar-nav">
        <div class="nav-section-title">My Track</div>
        
        <button class="nav-item active" data-member-tab="current">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 14 14"></polyline></svg>
          <span>Assigned Project</span>
        </button>

        <button class="nav-item" data-member-tab="past">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
          <span>Completed Track</span>
        </button>

        <div class="nav-section-title" style="margin-top: 16px;">Quick Links</div>

        <a href="/company/about" class="nav-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>
          <span>About PUVIMA</span>
        </a>
      </nav>

      <div class="sidebar-footer">
        <div class="user-mini-card">
          <div class="user-avatar current-user-avatar">I</div>
          <div class="user-meta">
            <div class="user-meta-name current-user-name">Intern</div>
            <div class="user-meta-role current-user-role">Research Intern</div>
          </div>
          <button data-logout-btn class="btn-sm btn-outline" style="border: none; padding: 4px;" title="Sign Out">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
          </button>
        </div>
      </div>
    </aside>

    <!-- Main Section -->
    <main class="portal-main">
      
      <!-- Header -->
      <header class="portal-header">
        <div class="header-left">
          <button id="mobileNavToggle" class="mobile-nav-toggle" aria-label="Open Navigation">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
          </button>
          <div class="page-breadcrumb">
            <span>Internship Workspace</span>
            <span>&bull;</span>
            <span class="current">Project Track</span>
          </div>
        </div>

        <div class="header-actions">
          <button id="notificationBellBtn" class="icon-btn" title="Notifications">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
            <span class="badge-dot" id="notificationBadgeDot" style="display: none;"></span>
          </button>
        </div>
      </header>

      <!-- Content -->
      <div class="portal-content">
        
        <div class="page-hero">
          <div>
            <h1 class="page-title">Research Fellowship & Project Space</h1>
            <p class="page-description">Participate in advanced research, document milestones, and collaborate directly with senior engineering mentors.</p>
          </div>
        </div>

        <!-- Main Tab Container -->
        <div id="memberTabContent">
          <!-- Rendered via employeeController.js -->
        </div>

      </div>
    </main>
  </div>

  <!-- Notifications Modal -->
  <div class="modal-backdrop" id="notificationsModal">
    <div class="modal-card">
      <div class="modal-header">
        <h3 class="modal-title">Notification Center</h3>
        <button class="modal-close" data-close-modal="notificationsModal">&times;</button>
      </div>
      <div class="modal-body" style="padding: 0;" id="notificationsList">
        <!-- Rendered dynamically -->
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" data-close-modal="notificationsModal">Dismiss</button>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/company/js/config.js"></script>
  <script src="/company/js/supabaseClient.js"></script>
  <script src="/company/js/auth.js"></script>
  <script src="/company/js/ui.js"></script>
  <script src="/company/js/services/userService.js"></script>
  <script src="/company/js/services/projectService.js"></script>
  <script src="/company/js/services/timelineService.js"></script>
  <script src="/company/js/services/notificationService.js"></script>
  <script src="/company/js/main.js"></script>
  <script src="/company/js/controllers/employeeController.js"></script>
</body>
</html>
